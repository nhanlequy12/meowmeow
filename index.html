<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mèo Xu</title>
<style>
:root{--bg:#e6dac8;--panel:#f4ecdf;--panel2:#e8d8c2;--ink:#523828;--dim:#725b4a;--pink:#f2a3b3;--blue:#86b2dc;--gold:#855a05;--line:#a07654;--soft:#d6c5ad;--rc:#ffd24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;overflow-x:hidden;
  background-image:radial-gradient(#d9cbb6 1.2px,transparent 1.3px);background-size:9px 9px}
#app{max-width:540px;margin:0 auto;padding:10px 12px 40px}
h1{font-size:19px;margin:2px 0 8px;letter-spacing:1px;color:#a2405a}
h2{color:var(--ink)}
h3{margin:10px 0 6px;font-size:15px}
.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--panel);border:3px dotted var(--line);border-radius:12px;padding:4px 9px;font-size:13.5px}
.chip b{color:var(--gold)}
.xp{flex:1;min-width:130px}
.bar{height:6px;background:var(--soft);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
#roomnav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#roomnav .nm{flex:1;text-align:center;background:var(--panel);border:3px dotted var(--line);border-radius:12px;padding:5px;font-size:14px}
#roomnav button{padding:6px 12px}
canvas#room{width:100%;display:block;border:4px dotted var(--line);border-radius:14px;cursor:grab;background:#e6d8c6;touch-action:pan-y;image-rendering:pixelated}
canvas#room.edit{touch-action:none;border-color:#e58aa0;cursor:move}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.tabs button{padding:7px 0;font-size:11.5px;line-height:1.25}
.tabs button span{display:block;font-size:17px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer}
button:active{transform:translateY(2px);border-bottom-width:2px}
button.on{background:var(--pink);color:#6a2438;border-color:#c97288}
button.go{background:#b4dcbd;color:#235536;border-color:#78b68c}
button.sm{padding:4px 8px;font-size:12.5px}
button.bad{background:#f9d0d6;color:#8a3040;border-color:#e0a0aa}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;color:var(--ink);background:#fbf5ea;border:2px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0;flex:1}
.row{display:flex;gap:6px;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:var(--panel);border:3px dotted var(--line);border-radius:14px;padding:9px;margin-bottom:8px;display:flex;gap:10px;align-items:center;text-align:left}
.card.tap{cursor:pointer}
.card .g{flex:1;min-width:0}
.card small,.dim{color:var(--dim);font-weight:600;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:var(--panel);border:3px dotted var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:11.5px}
.px,#gbox{image-rendering:pixelated}
.unk img{filter:brightness(0);opacity:.35}
.m{color:#5a9ae0}.f{color:#f080a8}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;margin-right:8px;white-space:nowrap}
.stat .bar{width:40px;margin:0;display:inline-block}
.tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:11.5px;margin:3px 4px 0 0;position:relative;cursor:help;border:2px solid;outline:none}
.tag.g{background:#d6f0de;color:#2f6b45;border-color:#9fd3b0}.tag.b{background:#fbd9de;color:#8a3040;border-color:#eba8b2}.tag.x{background:#fcebb6;color:#7a5a10;border-color:#e3c466}
.tag:hover::after,.tag:focus::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);width:200px;background:var(--ink);color:#fff8ee;padding:6px 8px;border-radius:8px;z-index:40;font-weight:600;white-space:normal;text-align:left;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(107,74,52,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal .box{background:var(--bg);border:4px dotted var(--line);border-radius:18px;padding:14px;max-width:420px;width:100%;max-height:88vh;overflow:auto;text-align:center}
#toast{position:fixed;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;z-index:50}
.tst{display:flex;align-items:center;gap:10px;width:min(92vw,400px);background:#fbf5ea;color:var(--ink);border:2px solid var(--ac);border-left-width:8px;border-radius:14px;padding:8px 12px;box-shadow:0 5px 12px rgba(82,56,40,.22);transform:translateY(-170%);opacity:0;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .25s,margin-bottom .3s ease}
.tst.on{transform:none;opacity:1}
.tst.out{transform:translateY(-50%);opacity:0}
.tst .ic{font-size:22px;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--ac) 30%,#fff);display:flex;align-items:center;justify-content:center;flex:none}
.tst .bd{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.tst .bd b{display:block;font-size:14.5px}
.tst .bd span{color:var(--dim);font-weight:600}
.tst .cn{font-size:23px;font-weight:900;color:#855a05;white-space:nowrap}
.foot{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.foot button{font-size:12px;padding:5px 8px;opacity:.8}
/* popup viễn chinh */
#pop{position:fixed;left:50%;top:18px;width:min(92vw,400px);transform:translate(-50%,calc(-100% - 80px));transition:transform .6s cubic-bezier(.34,1.56,.64,1);z-index:25;background:#fffaf0;color:#6b4a34;border:4px dotted #b58a66;border-radius:18px;box-shadow:0 0 0 5px #fffaf0,0 0 0 8px #f7a8b8,0 14px 0 4px rgba(107,74,52,.18);padding:12px}
#pop.on{transform:translate(-50%,0)}
#pop .hd{background:#fbd3db;margin:-12px -12px 10px;padding:8px 12px;border-bottom:4px dotted #b58a66;border-radius:14px 14px 0 0;font-size:15px}
#pop .big{font-size:26px;color:#d99a1c}
#pop .dim{color:#a58e7a}
/* gacha */
#gz{position:fixed;inset:0;display:none;z-index:30;overflow:hidden;align-items:center;justify-content:center;flex-direction:column}
#gz.on{display:flex}
#gz .dimmer{position:absolute;inset:0;background:rgba(107,74,52,.72);transition:background .8s}
#gz.dark .dimmer{background:rgba(24,14,10,.97)}
#gz .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(var(--rc) 0 7deg,transparent 7deg 20deg);opacity:0;animation:spin 10s linear infinite;transition:opacity .5s}
#gz.rayon .rays{opacity:.3}
#gz .pillar{position:absolute;left:50%;top:0;bottom:0;width:130px;margin-left:-65px;background:linear-gradient(90deg,transparent,#ffe08a 28%,#fff 50%,#ffe08a 72%,transparent);transform:scaleX(0);opacity:0}
#gz.pil .pillar{animation:pil 1.1s ease-out forwards}
#gz .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#gz.fl .flash{animation:fl .7s ease-out}
#gp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#gbox{position:relative;width:140px;height:140px;z-index:2}
#gbox.s{animation:shS .5s ease-in-out infinite}
#gbox.h{animation:shH .16s linear infinite}
#gbox.glow{filter:drop-shadow(0 0 16px var(--rc))}
#gz.quake>*{animation-name:quake;animation-duration:.5s}
#gfx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#gfly{position:absolute;left:0;top:38%;width:100%;height:120px;z-index:3;display:none;pointer-events:none}
#gfly.go{display:block}
#gfly .fl{display:flex;align-items:center;width:max-content;animation:fly 2s linear forwards}
#gfly .rb{width:70vw;height:66px;margin-right:-30px;background:linear-gradient(#ff8a8a 0 16.6%,#ffc478 16.6% 33.3%,#fff08c 33.3% 50%,#9ce296 50% 66.6%,#8cc4ff 66.6% 83.3%,#c4a0f0 83.3%);border-radius:4px}
#gfly img{width:108px;height:120px;animation:bob .3s ease-in-out infinite alternate}
#grev{position:relative;z-index:5;display:none;background:var(--bg);color:var(--ink);border:5px dotted var(--rc);border-radius:20px;padding:14px;width:min(92vw,360px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 0 0 5px var(--bg),0 0 34px var(--rc)}
#gskip{position:absolute;right:14px;bottom:14px;z-index:6}
.legend{font-size:27px;color:#e8a820;letter-spacing:4px;text-shadow:0 2px 0 #fff,0 0 16px #ffd86a;animation:pop .6s}
.st{display:inline-block;opacity:0;font-size:26px;animation:stpop .4s forwards;color:var(--rc)}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes stpop{0%{opacity:0;transform:scale(3) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes shS{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes shH{0%{transform:translate(-5px,2px) rotate(-9deg)}50%{transform:translate(5px,-3px) rotate(9deg)}100%{transform:translate(-5px,2px) rotate(-9deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pil{0%{transform:scaleX(0);opacity:0}30%{transform:scaleX(.3);opacity:1}100%{transform:scaleX(1.7);opacity:.85}}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
@keyframes quake{0%,100%{translate:0 0}20%{translate:-9px 5px}40%{translate:8px -6px}60%{translate:-6px -4px}80%{translate:5px 6px}}
@keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes grow{from{transform:scale(1);opacity:1}to{transform:scale(16);opacity:0}}
@keyframes slash{from{transform:scaleX(0);opacity:1}60%{transform:scaleX(1);opacity:1}to{transform:scaleX(1);opacity:0}}
@keyframes orbL{from{transform:translateX(-46vw) scale(.6)}to{transform:translateX(-18px) scale(1)}}
@keyframes orbR{from{transform:translateX(46vw) scale(.6)}to{transform:translateX(18px) scale(1)}}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(10);opacity:0}}
@keyframes ignite{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(75vh)}to{transform:translateY(0)}}
@keyframes drop{from{transform:translateY(-60vh)}to{transform:translateY(0)}}
@keyframes twk{from{transform:scale(.6) rotate(0);opacity:.5}to{transform:scale(1.25) rotate(20deg);opacity:1}}
@keyframes moon{from{transform:translateY(45vh)}to{transform:translateY(-42vh)}}
@keyframes dash{from{transform:translateX(-40vw)}to{transform:translateX(125vw)}}
@keyframes fly{from{transform:translateX(-80vw)}to{transform:translateX(110vw)}}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
</style>
</head>
<body>
<div id="app">
  <h1 style="user-select:none">🐾 MÈO XU</h1>
  <div class="top" id="top"></div>
  <div id="roomnav"></div>
  <canvas id="room" width="240" height="170"></canvas>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <div class="foot">
    <button onclick="doSkip()">⏩ Tua nhanh 10 phút (bản thử)</button>
    <button onclick="resetAll()">🗑 Chơi lại từ đầu</button>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="pop"></div>
<div id="gz">
  <div class="dimmer"></div><div class="rays"></div><div class="pillar"></div>
  <canvas id="gp"></canvas>
  <div id="gfx"></div>
  <div id="gfly"></div>
  <img id="gbox" alt="">
  <div id="grev"></div>
  <div class="flash"></div>
  <button id="gskip" onclick="gReveal(true)">Bỏ qua ▶▶</button>
</div>
<div id="toast"></div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
