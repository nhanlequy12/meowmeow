<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mèo Xu</title>
<!-- Màn chờ của app Windows (desktop/splash.html, stage.js chép thành web/splash.html). Lõi mở nó trong cửa sổ nhỏ
     420×280 không viền ngay khi chạy exe, rồi đóng khi game đã vẽ khung đầu (MXAPP.ready) hoặc sau tối đa 8 giây.
     ?t=dark: chủ đề tối (theo lựa chọn đã lưu, để không lóe nền sáng). Không có script nào chạy ngoài việc đọc ?t. -->
<style>
  :root {
    --bg: #e6dac8; --card: #fbefdc; --ink: #4e3026; --dim: #8a6a55; --line: #4e3026;
    --bead: #f6c7cf; --bead2: #bfe3d0; --bead3: #f8e19a; --track: #ead9c1;
  }
  html.dark {
    --bg: #27201b; --card: #372d27; --ink: #f3e8d9; --dim: #cdbca6; --line: #9a7a5c;
    --bead: #d87a8e; --bead2: #86dba6; --bead3: #f4cc66; --track: #4a3d33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); user-select: none; cursor: default; }
  body {
    display: grid; place-items: center;
    font: 600 14px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--ink);
  }
  .card {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--card);
    border: 4px solid var(--line);
    /* viền hạt cườm: hàng chấm tròn sáng chạy quanh mép trong */
    box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 7px var(--track);
  }
  .card::before {
    content: ""; position: absolute; inset: 10px; pointer-events: none;
    background:
      radial-gradient(circle, var(--bead) 2.2px, transparent 2.8px) 0 0 / 12px 12px repeat-x,
      radial-gradient(circle, var(--bead2) 2.2px, transparent 2.8px) 6px 100% / 12px 12px repeat-x;
    opacity: .9;
  }
  .cat {
    width: 128px; height: 128px; margin-top: 6px;
    image-rendering: pixelated; image-rendering: crisp-edges;
    filter: drop-shadow(0 3px 0 rgba(78, 48, 38, .25));
  }
  h1 { font: 800 26px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .5px; }
  .sub { font-size: 12px; color: var(--dim); font-weight: 600; }
  .bar {
    width: 196px; height: 14px; margin-top: 2px; position: relative; overflow: hidden;
    border: 2px solid var(--line); border-radius: 8px; background: var(--track);
  }
  .bar i {
    position: absolute; top: 1px; left: 0; height: 8px; width: 64px; border-radius: 5px;
    background:
      radial-gradient(circle, var(--bead) 2.6px, transparent 3.2px) 0 50% / 10px 8px repeat-x,
      var(--bead3);
    animation: run 1.1s cubic-bezier(.45, 0, .55, 1) infinite alternate;
    will-change: transform;
  }
  @keyframes run { from { transform: translateX(2px); } to { transform: translateX(126px); } }
  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: pulse 1.6s ease-in-out infinite alternate; width: auto; right: 1px; left: 1px; }
    @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  }
</style>
<script>if (/[?&]t=dark/.test(location.search)) document.documentElement.className = 'dark';</script>
</head>
<body oncontextmenu="return false">
  <div class="card" role="status" aria-label="Mèo Xu đang mở">
    <img class="cat" src="icons/icon-512.png" alt="" width="128" height="128" draggable="false">
    <h1>Mèo Xu</h1>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="sub">Đang mở game…</div>
  </div>
</body>
</html>
